name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install "numpy==1.26.4"
      - name: Shell checks
        run: |
          bash -n ./*.sh scripts/*.sh lib/*.sh
          shellcheck -S warning ./*.sh scripts/*.sh lib/*.sh
      - name: Python checks
        run: |
          python -m py_compile ./*.py
          python -m unittest discover -s tests -v
      - name: Privacy guard
        run: |
          if find . -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print -quit | grep -q .; then
            echo "media files must not be committed" >&2
            exit 1
          fi
          if rg -i 'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY|10\.10\.[0-9]+\.[0-9]+|nasbox\.local|evox3\.local'; then
            echo "private key or private deployment identifier found" >&2
            exit 1
          fi
